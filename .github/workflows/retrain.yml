name: Weekly ReNET Retrain

on:
  schedule:
    - cron: '0 2 * * 0' # Every Sunday at 2 AM
  workflow_dispatch: # Also allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run retraining
        env:
          DB_URL: ${{ secrets.DB_URL }}
        run: python -m app.services.retrainService

      - name: Commit updated models
        run: |
          git config --global user.email "ci@renet.ai"
          git config --global user.name "ReNet CI"
          git add app/artifacts/
          git commit -m "chore: auto-retrain models [skip ci]"
          git push
